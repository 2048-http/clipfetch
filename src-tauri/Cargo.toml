[package]
name = "clipfetch"
version = "0.1.1"
description = "ClipFetch short video parser desktop shell"
authors = ["QStudio"]
edition = "2021"

[lib]
name = "clipfetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
